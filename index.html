<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FunnyToon AI</title>
<style>
body{margin:0;padding:20px;background:#130e24;color:white;font-family:Arial,sans-serif}
main{max-width:600px;margin:auto}
h1{text-align:center;color:#b99aff}
.card{background:#251b3b;padding:18px;border-radius:18px;margin:18px 0}
textarea,select,button{box-sizing:border-box;width:100%;padding:13px;margin:8px 0;border-radius:10px;font-size:16px}
textarea,select{background:#171126;color:white;border:1px solid #766394}
button{background:#9167ff;color:white;border:0;font-weight:bold}
.scene{background:linear-gradient(#ffb7df,#9b8cff);color:#25143b;border-radius:16px;text-align:center;padding:25px}
#face{font-size:95px}
#caption{font-weight:bold}
small{color:#c9bedf}
</style>
</head>
<body>
<main>
<h1>🎬 FunnyToon AI</h1>
<p style="text-align:center">Your funny cartoon studio!</p>
<div class="card">
<h2>✨ Create a scene</h2>
<textarea id="story">A funny egg sees someone running and shouts, WHAT?!</textarea>
<select id="faceChoice">
<option value="😂">Funny cartoon</option>
<option value="😱">Shocked cartoon</option>
<option value="🥚">Egg character</option>
<option value="🤖">Robot character</option>
</select>
<label>Voice</label>
<select id="voice">
<option value="funny">Funny voice</option>
<option value="shock">Shocked voice</option>
<option value="normal">Normal voice</option>
</select>
<label>Speed</label>
<select id="speed">
<option value="0.7">Slow</option>
<option value="1" selected>Normal</option>
<option value="1.5">Fast</option>
<option value="2">Very fast</option>
</select>
<button onclick="makeScene()">Preview cartoon</button>
</div>
<div class="card">
<h2>📺 Your cartoon</h2>
<div class="scene">
<div id="face">😂</div>
<p id="caption">Your cartoon appears here!</p>
</div>
<button onclick="speak()">🔊 Play voice</button>
<button onclick="stopVoice()">Stop voice</button>
<p><small>This first version previews scenes and uses your browser's voice. Real AI video generation is not connected yet.</small></p>
</div>
<div class="card">
<h2>🎞️ Video preview</h2>
<input id="upload" type="file" accept="video/*">
<video id="vid" controls playsinline style="width:100%;display:none;border-radius:12px"></video>
<button onclick="filterVideo()">Toggle cartoon filter</button>
</div>
</main>
<script>
function makeScene(){
document.getElementById('face').textContent=document.getElementById('faceChoice').value;
document.getElementById('caption').textContent=document.getElementById('story').value;
}
function speak(){
if(!window.speechSynthesis){alert('Voice playback is not supported here');return;}
speechSynthesis.cancel();
let u=new SpeechSynthesisUtterance(document.getElementById('story').value);
let v=document.getElementById('voice').value;
u.pitch=v==='shock'?1.9:v==='funny'?1.6:1;
u.rate=Number(document.getElementById('speed').value);
speechSynthesis.speak(u);
}
function stopVoice(){if(window.speechSynthesis)speechSynthesis.cancel();}
document.getElementById('upload').addEventListener('change',function(){
if(this.files[0]){
let v=document.getElementById('vid');
v.src=URL.createObjectURL(this.files[0]);v.style.display='block';
}});
function filterVideo(){document.getElementById('vid').style.filter='saturate(2) contrast(1.3)';}
</script>
</body>
</html>
